name: trade_app
description: A comprehensive offline commerce and inventory management app.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  provider: ^6.1.1
  excel: ^4.0.0
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  image_picker: ^1.0.4
  fl_chart: ^0.66.0
  file_picker: ^8.0.0 # Added missing dependency

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Fonts removed because assets/fonts/ directory is missing in the zip
